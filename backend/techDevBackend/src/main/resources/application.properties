spring.application.name=techDevBackend

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techdev_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:techdev_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:techdev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000

# Github
github.token=${GITHUB_TOKEN:}

# Dosya yükleme ayarlar?
app.upload-dir=/app/uploads
app.base-url=http://localhost:8080
app.jwt.secret=6d82s1cGaDMWwzb2VWjbyMspFVMLofKnpT9TMKF0+Qk=
app.jwt.expiration-ms=86400000
app.verification.code-expiry-minutes=15

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mailhog
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# DeepL
deepl.api-key=${DEEPL_API_KEY:}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false
sentry.traces-sample-rate=0.0

# Actuator - hangi endpoint'ler aç?k olsun
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=techdev-backend

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.techdevWeb=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# WebClient timeout ayarlar?
spring.webflux.client.connect-timeout=5000
spring.webflux.client.response-timeout=5000
