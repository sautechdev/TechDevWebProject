version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: techdev-postgres
    environment:
      POSTGRES_DB: techdev_db
      POSTGRES_USER: techdev_user
      POSTGRES_PASSWORD: techdev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techdev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdev_user -d techdev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techdev-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - techdev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: techdev-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - techdev-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: techdev-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - techdev-network
    depends_on:
      - prometheus

  mailhog:
    image: mailhog/mailhog
    container_name: techdev-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - techdev-network

  backend:
    build:
      context: ./backend/techDevBackend
      dockerfile: Dockerfile
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    container_name: techdev-backend
    ports:
      - "8080:8080"
    volumes:
      - uploaded_files:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techdev_db
      SPRING_DATASOURCE_USERNAME: techdev_user
      SPRING_DATASOURCE_PASSWORD: techdev_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailhog
      SPRING_REDIS_PORT: 6379
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - techdev-network
    restart: on-failure

networks:
  techdev-network:
    driver: bridge

volumes:
  postgres_data:
  uploaded_files:
  prometheus_data:
  grafana_data: